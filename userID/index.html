<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>USER INFO</title>
    <style>
      body {
        background: #f5f5f5;
        font-family: Arial, sans-serif;
      }
      /* user info */
      #userInfo {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 20px;
        padding: 16px;
      }
      /* card */
      .user-card {
        max-width: 320px;
        background: #fff;
        padding: 18px;
        border-radius: 14px;
        border: 1px solid rgba(128, 128, 128, 0.25);
        margin: 40px auto;
        transition: 0.3s ease;
      }

      /* hover effect */
      .user-card:hover {
        border: 1px solid gold;
        box-shadow: 0 6px 18px rgba(255, 215, 0, 0.3);
        transform: translateY(-4px);
      }

      .user-card h2 {
        margin-bottom: 8px;
        font-size: 18px;
      }

      .user-card p {
        font-size: 14px;
        color: #555;
        margin: 4px 0;
      }

      .address {
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px solid #eee;
      }

      .address h4 {
        font-size: 14px;
        margin-bottom: 4px;
      }
    </style>
  </head>
  <body>
    <div id="userInfo"></div>

    <script src="user.js"></script>
  </body>
</html>
